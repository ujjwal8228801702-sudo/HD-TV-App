<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #070a12; color: #fff; display: flex; height: 100vh; overflow: hidden; }
  
  .sidebar { width: 300px; background: #0d1322; border-right: 1px solid #1e293b; display: flex; flex-direction: column; padding: 12px; z-index: 10; }
  .brand { display: flex; align-items: center; justify-content: space-between; font-size: 20px; font-weight: 800; color: #00e5ff; margin-bottom: 10px; }
  .brand span { background: #e50914; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  
  .search-box { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #263554; background: #162038; color: #fff; margin-bottom: 10px; font-size: 13px; }
  .search-box:focus { outline: 2px solid #00e5ff; }

  .cats { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .cat-btn { background: #162038; border: 1px solid #263554; color: #cbd5e1; padding: 5px 9px; border-radius: 7px; font-size: 11px; cursor: pointer; font-weight: 600; }
  .cat-btn.active, .cat-btn:focus { background: #e50914; color: #fff; border-color: #ff4d5a; outline: 2px solid #00e5ff; }
  
  .channels { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding-right: 4px; }
  .ch-card { display: flex; align-items: center; justify-content: space-between; background: #11192c; padding: 9px 11px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; transition: 0.15s; }
  .ch-card:hover, .ch-card:focus, .ch-card.playing { background: #1a2744; border-color: #00e5ff; outline: none; }
  .ch-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .ch-num { background: #1e293b; color: #00e5ff; font-weight: 700; font-size: 11px; padding: 3px 6px; border-radius: 5px; flex-shrink: 0; }
  .ch-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd-badge { background: linear-gradient(45deg, #e50914, #ff512f); font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }

  .btn-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-btn { flex: 1; background: #00e5ff; color: #070a12; border: none; padding: 9px; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; }
  .reload-btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
  .add-btn:focus, .reload-btn:focus { outline: 2px solid #fff; }

  .player-wrap { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .osd { position: absolute; top: 18px; left: 18px; background: rgba(13, 19, 34, 0.88); backdrop-filter: blur(8px); padding: 10px 16px; border-radius: 10px; border-left: 4px solid #e50914; pointer-events: none; transition: opacity 0.4s; }
  .osd h2 { font-size: 17px; color: #fff; }
  .osd p { font-size: 12px; color: #00e5ff; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 99; }
  .modal-box { background: #0d1322; padding: 20px; border-radius: 14px; width: 90%; max-width: 420px; border: 1px solid #00e5ff; }
  .modal-box h3 { margin-bottom: 12px; color: #00e5ff; }
  .modal-box input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #162038; color: #fff; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="brand">HD TV <span>LIVE</span></div>
  <input type="text" class="search-box" id="searchInput" placeholder="Search channel..." oninput="renderChannels()">
  <div class="cats">
    <button class="cat-btn active" tabindex="0" onclick="filterCat('ALL', this)">All</button>
    <button class="cat-btn" tabindex="0" onclick="filterCat('ZEE', this)">Zee</button>
    <button class="cat-btn" tabindex="0" onclick="filterCat('STAR', this)">Star Sports</button>
    <button class="cat-btn" tabindex="0" onclick="filterCat('SONY', this)">Sony</button>
    <button class="cat-btn" tabindex="0" onclick="filterCat('NEWS', this)">News</button>
  </div>
  <div class="channels" id="channelList"></div>
  <div class="btn-row">
    <button class="add-btn" tabindex="0" onclick="openModal()">+ Add M3U / URL</button>
    <button class="reload-btn" tabindex="0" onclick="loadAutoPlaylist(true)">↻ Sync</button>
  </div>
</div>

<div class="player-wrap" onclick="toggleSidebar()">
  <video id="video" autoplay playsinline></video>
  <div class="osd" id="osd">
    <h2 id="osdTitle">Loading HD Channels...</h2>
    <p id="osdCat">Please wait</p>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3>Add Channel or M3U Playlist</h3>
    <input type="text" id="chNameInput" placeholder="Channel Name (e.g. Zee Cinema HD)">
    <input type="text" id="chCatInput" placeholder="Category (ZEE / STAR / SONY / NEWS)">
    <input type="text" id="chUrlInput" placeholder="Paste .m3u8 Stream URL OR .m3u Playlist URL">
    <div class="modal-actions">
      <button class="btn" style="background:#334155;color:#fff;" onclick="closeModal()">Cancel</button>
      <button class="btn" style="background:#00e5ff;color:#000;" onclick="saveChannel()">Save & Load</button>
    </div>
  </div>
</div>

<script>
const AUTO_PLAYLIST_URL = "https://iptv-org.github.io/iptv/languages/hin.m3u";
let channels = JSON.parse(localStorage.getItem('hdtv_channels_v2')) || [];
let currentCat = 'ALL';
let hls = null;
const video = document.getElementById('video');

function detectCategory(name) {
  const up = name.toUpperCase();
  if (up.includes('ZEE') || up.includes('&TV') || up.includes('&PICTURES') || up.includes('BIG MAGIC')) return 'ZEE';
  if (up.includes('STAR') || up.includes('SPORTS') || up.includes('CRICKET')) return 'STAR';
  if (up.includes('SONY') || up.includes('SAB') || up.includes('TEN')) return 'SONY';
  if (up.includes('NEWS') || up.includes('AAJ TAK') || up.includes('NDTV') || up.includes('INDIA TV') || up.includes('ABP')) return 'NEWS';
  return 'ALL';
}

function parseM3U(text) {
  const lines = text.split('\n');
  let parsed = [];
  let tempName = '';
  lines.forEach(line => {
    line = line.trim();
    if (line.startsWith('#EXTINF')) {
      const parts = line.split(',');
      tempName = parts[parts.length - 1] || 'HD Channel';
    } else if (line.startsWith('http')) {
      parsed.push({
        num: parsed.length + 101,
        name: tempName.trim(),
        cat: detectCategory(tempName),
        url: line
      });
    }
  });
  return parsed;
}

async function loadAutoPlaylist(force = false) {
  if (channels.length > 0 && !force) {
    renderChannels();
    playChannel(channels[0]);
    return;
  }
  showOSD("Syncing Channels...", "Fetching live streams");
  try {
    const res = await fetch(AUTO_PLAYLIST_URL);
    const text = await res.text();
    const fetched = parseM3U(text);
    if (fetched.length > 0) {
      channels = fetched;
      localStorage.setItem('hdtv_channels_v2', JSON.stringify(channels));
      renderChannels();
      playChannel(channels[0]);
    }
  } catch (e) {
    showOSD("Offline / Sync Failed", "Click '+ Add M3U / URL' to add manually");
  }
}

function renderChannels() {
  const list = document.getElementById('channelList');
  const query = document.getElementById('searchInput').value.toLowerCase();
  list.innerHTML = '';

  const filtered = channels.filter(c => {
    const matchCat = currentCat === 'ALL' || c.cat === currentCat;
    const matchSearch = c.name.toLowerCase().includes(query);
    return matchCat && matchSearch;
  });

  filtered.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'ch-card';
    div.tabIndex = 0;
    div.innerHTML = `
      <div class="ch-info">
        <span class="ch-num">${ch.num}</span>
        <span class="ch-name">${ch.name}</span>
      </div>
      <span class="hd-badge">HD</span>
    `;
    div.onclick = () => playChannel(ch, div);
    div.onkeydown = (e) => { if (e.key === 'Enter') playChannel(ch, div); };
    list.appendChild(div);
  });
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChannels();
}

function playChannel(ch, el) {
  if (!ch || !ch.url) return;
  document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('playing'));
  if (el) el.classList.add('playing');

  showOSD(ch.name, `CH #${ch.num} • LIVE HD`);

  if (hls) { hls.destroy(); }
  if (Hls.isSupported() && ch.url.includes('.m3u8')) {
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
  } else {
    video.src = ch.url;
    video.play().catch(() => {});
  }
}

function showOSD(title, sub) {
  const osd = document.getElementById('osd');
  document.getElementById('osdTitle').innerText = title;
  document.getElementById('osdCat').innerText = sub;
  osd.style.opacity = '1';
  clearTimeout(window.osdTimer);
  window.osdTimer = setTimeout(() => { osd.style.opacity = '0.15'; }, 4000);
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.style.display = sb.style.display === 'none' ? 'flex' : 'none';
}

function handleBack() {
  const modal = document.getElementById('modal');
  if (modal.style.display === 'flex') { closeModal(); return; }
  toggleSidebar();
}

function openModal() { document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function saveChannel() {
  const name = document.getElementById('chNameInput').value.trim();
  const cat = (document.getElementById('chCatInput').value.trim() || 'ALL').toUpperCase();
  const url = document.getElementById('chUrlInput').value.trim();

  if (!url) return;

  if (url.includes('.m3u') && !url.includes('.m3u8')) {
    try {
      const res = await fetch(url);
      const text = await res.text();
      const added = parseM3U(text);
      channels = [...added, ...channels];
    } catch (e) {
      alert("M3U load nahi ho paya, direct .m3u8 link try karein.");
      return;
    }
  } else {
    channels.unshift({ num: 100, name: name || 'Custom HD Channel', cat: cat, url: url });
  }

  localStorage.setItem('hdtv_channels_v2', JSON.stringify(channels));
  renderChannels();
  playChannel(channels[0]);
  closeModal();
}

let numBuffer = '';
document.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT') return;
  if (e.key >= '0' && e.key <= '9') {
    numBuffer += e.key;
    showOSD(`Channel #${numBuffer}`, 'Switching...');
    clearTimeout(window.numTimer);
    window.numTimer = setTimeout(() => {
      const found = channels.find(c => String(c.num) === numBuffer);
      if (found) playChannel(found);
      numBuffer = '';
    }, 1000);
  }
});

loadAutoPlaylist();
</script>
</body>
</html>
